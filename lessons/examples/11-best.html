<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рекорд</title>
  <link rel="stylesheet" href="11.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Прыжок</h2>
      <p class="list answer">6,15,9,3</p>
      <label>
        Новый
        <input class="jump" type="text" value="8">
      </label>
      <button class="add" type="button">Добавить</button>
      <p>Рекорд</p>
      <p class="record answer">15</p>
    </div>
  </div>
  <script>
    const listText = document.querySelector('.list');
    const jump = document.querySelector('.jump');
    const add = document.querySelector('.add');
    const recordText = document.querySelector('.record');
    const jumps = [6, 15, 9, 3];

    function biggest(numbers) {
      let best = numbers[0];
      for (let i = 1; i < numbers.length; i++) {
        if (numbers[i] > best) {
          best = numbers[i];
        }
      }
      return best;
    }

    function show() {
      listText.textContent = jumps;
      recordText.textContent = biggest(jumps);
    }

    add.addEventListener('click', function () {
      jumps.push(Number(jump.value));
      show();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рекорд</title>
  <link rel="stylesheet" href="11.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Прыжок</h2>
      <p>6,15,9,3</p>
      <button class="record" type="button">Рекорд</button>
      <p class="answer">0</p>
    </div>
  </div>
  <script>
    const record = document.querySelector('.record');
    const answer = document.querySelector('.answer');
    const jumps = [6, 15, 9, 3];

    function biggest(numbers) {
      let best = numbers[0];
      for (let i = 1; i < numbers.length; i++) {
        if (numbers[i] > best) {
          best = numbers[i];
        }
      }
      return best;
    }

    record.addEventListener('click', function () {
      answer.textContent = biggest(jumps);
    });
  </script>
</body>
</html>

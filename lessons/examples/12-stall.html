<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лавка</title>
  <link rel="stylesheet" href="12.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Буфет</h2>

      <div class="product">
        <h2>Вафли</h2>
        <p>Цена: 15</p>
        <p class="count answer">0</p>
        <div class="buttons">
          <button class="more" type="button">Ещё</button>
          <button class="less" type="button">Меньше</button>
        </div>
      </div>

      <div class="product">
        <h2>Молоко</h2>
        <p>Цена: 22</p>
        <p class="count answer">0</p>
        <div class="buttons">
          <button class="more" type="button">Ещё</button>
          <button class="less" type="button">Меньше</button>
        </div>
      </div>

      <div class="product">
        <h2>Пряник</h2>
        <p>Цена: 14</p>
        <p class="count answer">0</p>
        <div class="buttons">
          <button class="more" type="button">Ещё</button>
          <button class="less" type="button">Меньше</button>
        </div>
      </div>

      <div class="product">
        <h2>Компот</h2>
        <p>Цена: 16</p>
        <p class="count answer">0</p>
        <div class="buttons">
          <button class="more" type="button">Ещё</button>
          <button class="less" type="button">Меньше</button>
        </div>
      </div>

      <div class="product">
        <p>Итого</p>
        <p class="total answer">0</p>
      </div>
    </div>
  </div>
  <script>
    const moreButtons = document.querySelectorAll('.more');
    const lessButtons = document.querySelectorAll('.less');
    const texts = document.querySelectorAll('.count');
    const total = document.querySelector('.total');
    const goods = [
      { name: 'Вафли', price: 15, count: 0 },
      { name: 'Молоко', price: 22, count: 0 },
      { name: 'Пряник', price: 14, count: 0 },
      { name: 'Компот', price: 16, count: 0 }
    ];

    function totalCost(items) {
      let result = 0;
      for (let i = 0; i < items.length; i++) {
        result = result + items[i].price * items[i].count;
      }
      return result;
    }

    function show() {
      for (let i = 0; i < texts.length; i++) {
        texts[i].textContent = goods[i].count;
      }
      total.textContent = totalCost(goods);
    }

    for (let i = 0; i < moreButtons.length; i++) {
      moreButtons[i].addEventListener('click', function () {
        goods[i].count = goods[i].count + 1;
        show();
      });
    }

    for (let i = 0; i < lessButtons.length; i++) {
      lessButtons[i].addEventListener('click', function () {
        if (goods[i].count > 0) {
          goods[i].count = goods[i].count - 1;
        }
        show();
      });
    }
  </script>
</body>
</html>

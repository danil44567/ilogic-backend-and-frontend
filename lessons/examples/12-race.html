<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Свои кнопки</title>
  <link rel="stylesheet" href="12.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Гонка</h2>

      <div class="product">
        <h2>Лиса</h2>
        <p>Шаг: 5</p>
        <p class="points answer">0</p>
        <button class="add" type="button">+5</button>
      </div>

      <div class="product">
        <h2>Волк</h2>
        <p>Шаг: 8</p>
        <p class="points answer">0</p>
        <button class="add" type="button">+8</button>
      </div>

      <div class="product">
        <h2>Заяц</h2>
        <p>Шаг: 3</p>
        <p class="points answer">0</p>
        <button class="add" type="button">+3</button>
      </div>

      <div class="product">
        <p>Сумма</p>
        <p class="total answer">0</p>
      </div>
    </div>
  </div>
  <script>
    const buttons = document.querySelectorAll('.add');
    const texts = document.querySelectorAll('.points');
    const total = document.querySelector('.total');
    const players = [
      { name: 'Лиса', points: 0, step: 5 },
      { name: 'Волк', points: 0, step: 8 },
      { name: 'Заяц', points: 0, step: 3 }
    ];

    function sum(items) {
      let result = 0;
      for (let i = 0; i < items.length; i++) {
        result = result + items[i].points;
      }
      return result;
    }

    function show() {
      for (let i = 0; i < texts.length; i++) {
        texts[i].textContent = players[i].points;
      }
      total.textContent = sum(players);
    }

    for (let i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function () {
        players[i].points = players[i].points + players[i].step;
        show();
      });
    }
  </script>
</body>
</html>

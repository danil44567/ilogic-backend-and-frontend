<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сколько чисел</title>
  <link rel="stylesheet" href="10.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Бусины</h2>
      <p class="list answer">9,6,1</p>
      <p class="size answer">3</p>
      <button class="add" type="button">Добавить 7</button>
    </div>
  </div>
  <script>
    const listText = document.querySelector('.list');
    const sizeText = document.querySelector('.size');
    const addButton = document.querySelector('.add');
    const numbers = [9, 6, 1];
    const bead = 7;

    function show() {
      listText.textContent = numbers;
      sizeText.textContent = numbers.length;
    }

    addButton.addEventListener('click', function () {
      numbers.push(bead);
      show();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сколько больше</title>
  <link rel="stylesheet" href="11.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Прыжки</h2>
      <p>5,12,8,12,1</p>
      <label>
        Граница
        <input class="limit" type="text">
      </label>
      <p class="answer">0</p>
    </div>
  </div>
  <script>
    const limit = document.querySelector('.limit');
    const answer = document.querySelector('.answer');
    const jumps = [5, 12, 8, 12, 1];

    function countAbove(numbers, border) {
      let count = 0;
      for (let i = 0; i < numbers.length; i++) {
        if (numbers[i] > border) {
          count = count + 1;
        }
      }
      return count;
    }

    limit.addEventListener('input', function () {
      answer.textContent = countAbove(jumps, Number(limit.value));
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Снять последнее</title>
  <link rel="stylesheet" href="10.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Башня</h2>
      <p class="list answer">9,2,6,7</p>
      <p class="last answer">0</p>
      <button class="take" type="button">Снять</button>
    </div>
  </div>
  <script>
    const listText = document.querySelector('.list');
    const lastText = document.querySelector('.last');
    const take = document.querySelector('.take');
    const blocks = [9, 2, 6, 7];

    function showList() {
      listText.textContent = blocks;
    }

    take.addEventListener('click', function () {
      if (blocks.length > 0) {
        lastText.textContent = blocks.pop();
      }
      showList();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Снятая галочка</title>
  <link rel="stylesheet" href="07.css">
</head>
<body>
  <div class="card">
    <form class="signup">
      <label>
        Имя
        <input class="name" type="text" name="name" required>
      </label>
      <label class="choice">
        <input class="rules" type="checkbox" name="rules">
        Я прочитал правила
      </label>
      <button type="submit">Отправить</button>
      <p class="answer"></p>
    </form>
  </div>
  <script>
    const form = document.querySelector('.signup');
    const nameField = document.querySelector('.name');
    const rules = document.querySelector('.rules');
    const answer = document.querySelector('.answer');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      if (!rules.checked) {
        answer.textContent = 'Сначала прочитай правила, ' + nameField.value;
      } else {
        answer.textContent = 'Ждём тебя в группе, ' + nameField.value;
      }
    });
  </script>
</body>
</html>

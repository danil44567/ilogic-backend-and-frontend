<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Свои кнопки</title>
  <link rel="stylesheet" href="13.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Гонка</h2>
      <div class="list stack"></div>
      <p>Сумма</p>
      <p class="total answer">0</p>
    </div>
  </div>
  <script>
    const list = document.querySelector('.list');
    const total = document.querySelector('.total');
    const players = [
      { name: 'Рысь', points: 0, step: 4 },
      { name: 'Барс', points: 0, step: 7 },
      { name: 'Олень', points: 0, step: 3 }
    ];

    function sum(items) {
      let total = 0;
      for (let i = 0; i < items.length; i++) {
        total = total + items[i].points;
      }
      return total;
    }

    function show() {
      list.textContent = '';
      for (let i = 0; i < players.length; i++) {
        const card = document.createElement('div');
        card.classList.add('product');

        const nameText = document.createElement('p');
        nameText.textContent = players[i].name + ' ' + players[i].points;

        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = '+' + players[i].step;
        button.addEventListener('click', function () {
          players[i].points = players[i].points + players[i].step;
          show();
        });

        card.append(nameText);
        card.append(button);
        list.append(card);
      }
      total.textContent = sum(players);
    }

    show();
  </script>
</body>
</html>

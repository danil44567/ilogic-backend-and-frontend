<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Стоимость</title>
  <link rel="stylesheet" href="08.css">
</head>
<body>
  <div class="card">
    <div class="stack">
      <h2>Билет в кино</h2>
      <p class="price">Цена: 80</p>
      <label>
        Количество
        <input class="quantity" type="text" value="1">
      </label>
      <p class="answer">80</p>
    </div>
  </div>
  <script>
    const price = 80;
    const quantity = document.querySelector('.quantity');
    const answer = document.querySelector('.answer');

    quantity.addEventListener('input', function () {
      answer.textContent = price * Number(quantity.value);
    });
  </script>
</body>
</html>
